name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install test browser
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Upload failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ci-failure-details
          path: test-results/
          if-no-files-found: ignore
